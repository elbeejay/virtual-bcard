<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Digital Business Card - John Doe</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0f49bd",
                        "background-light": "#EBEAE5",
                        "background-dark": "#101622",
                        "surface": "#F4F3EF",
                        "text-main": "#2B2A27",
                        "text-muted": "#8A877E",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    boxShadow: {
                        'emboss': '6px 6px 12px #D1D0CB, -6px -6px 12px #FFFFFF',
                        'emboss-sm': '4px 4px 8px #D1D0CB, -4px -4px 8px #FFFFFF',
                        'deboss': 'inset 4px 4px 8px #D1D0CB, inset -4px -4px 8px #FFFFFF',
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        ::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        html {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-background-light min-h-screen flex justify-center items-center text-text-main font-display selection:bg-primary selection:text-white transition-colors duration-300">
    <!-- Main Container -->
    <main class="w-full max-w-[400px] flex flex-col items-center px-6 py-12">

        <!-- Profile Portrait -->
        <div class="relative mb-6">
            <div class="w-[120px] h-[120px] rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.12)] flex items-center justify-center bg-white p-1">
                <div class="w-full h-full rounded-full overflow-hidden">
                    <img alt="Portrait of John Doe" class="w-full h-full object-cover object-center" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJFsE-XIsJSTgdM7R32MD_tnjwO3QjmbRaJWIHKonJiWFBWbDGaeaOkweGtYnS2gHKZRe0PoHLLeU4A6vk7BB_XuoLVaaLpfCziXILk3oIA8nGZcbfsAEraolct_T6_sCHipAUHtLAMX62jLQwttkdpm2J9W3NlbHFmzGwcE84ObtZk5FKTH48HSCeCO_Gqfq2HqjxSuE29yFLgRRwM-2WMCfBWRKgLuNrt7XDNZ531lA5pOqiz2FmyK6XoDYD7N3dCqAxHtT39RHa"/>
                </div>
            </div>
        </div>

        <!-- Typography Stack -->
        <div class="flex flex-col items-center text-center w-full max-w-[320px]">
            <h1 class="text-[32px] font-bold tracking-tight text-[#1C1C1A] leading-none mb-2">
                John Doe
            </h1>
            <h2 class="text-lg font-medium text-primary tracking-wide mb-4">
                Creative Director
            </h2>
            <p class="text-[16px] text-text-muted leading-[1.6] font-normal">
                Crafting premium digital experiences and tactile interfaces for forward-thinking brands and independent consultants.
            </p>
        </div>

        <!-- Contact Actions -->
        <div class="w-full pt-8 space-y-4 max-w-[320px]">
            <!-- Email Pill -->
            <a class="flex items-center justify-between px-6 py-4 bg-background-light rounded-full shadow-emboss hover:shadow-emboss-sm active:shadow-deboss transition-all duration-200 group w-full" href="mailto:hello@example.com">
                <div class="flex items-center gap-4">
                    <span class="material-symbols-outlined text-text-muted group-hover:text-primary transition-colors text-[22px]">mail</span>
                    <span class="text-sm font-semibold text-text-main group-hover:text-primary transition-colors">hello@example.com</span>
                </div>
                <span class="material-symbols-outlined text-text-muted/50 text-[18px]">chevron_right</span>
            </a>

            <!-- Phone Pill -->
            <a class="flex items-center justify-between px-6 py-4 bg-background-light rounded-full shadow-emboss hover:shadow-emboss-sm active:shadow-deboss transition-all duration-200 group w-full" href="tel:+15551234567">
                <div class="flex items-center gap-4">
                    <span class="material-symbols-outlined text-text-muted group-hover:text-primary transition-colors text-[22px]">call</span>
                    <span class="text-sm font-semibold text-text-main group-hover:text-primary transition-colors">+1 (555) 123-4567</span>
                </div>
                <span class="material-symbols-outlined text-text-muted/50 text-[18px]">chevron_right</span>
            </a>

            <!-- Personal Website Pill -->
            <a class="flex items-center justify-between px-6 py-4 bg-background-light rounded-full shadow-emboss hover:shadow-emboss-sm active:shadow-deboss transition-all duration-200 group w-full" href="https://www.johndoe.com" target="_blank">
                <div class="flex items-center gap-4">
                    <span class="material-symbols-outlined text-text-muted group-hover:text-primary transition-colors text-[22px]">language</span>
                    <span class="text-sm font-semibold text-text-main group-hover:text-primary transition-colors">www.johndoe.com</span>
                </div>
                <span class="material-symbols-outlined text-text-muted/50 text-[18px]">open_in_new</span>
            </a>

            <!-- Social Grid -->
            <div class="grid grid-cols-4 gap-4 pt-4">
                <a aria-label="Work" class="aspect-square flex items-center justify-center bg-background-light rounded-2xl shadow-emboss hover:shadow-emboss-sm active:shadow-deboss transition-all duration-200 group" href="#">
                    <span class="material-symbols-outlined text-text-muted group-hover:text-primary transition-colors text-[24px]">work</span>
                </a>
                <a aria-label="Tag" class="aspect-square flex items-center justify-center bg-background-light rounded-2xl shadow-emboss hover:shadow-emboss-sm active:shadow-deboss transition-all duration-200 group" href="#">
                    <span class="material-symbols-outlined text-text-muted group-hover:text-primary transition-colors text-[24px]">tag</span>
                </a>
                <a aria-label="Camera" class="aspect-square flex items-center justify-center bg-background-light rounded-2xl shadow-emboss hover:shadow-emboss-sm active:shadow-deboss transition-all duration-200 group" href="#">
                    <span class="material-symbols-outlined text-text-muted group-hover:text-primary transition-colors text-[24px]">photo_camera</span>
                </a>
                <a aria-label="Code" class="aspect-square flex items-center justify-center bg-background-light rounded-2xl shadow-emboss hover:shadow-emboss-sm active:shadow-deboss transition-all duration-200 group" href="#">
                    <span class="material-symbols-outlined text-text-muted group-hover:text-primary transition-colors text-[24px]">code</span>
                </a>
            </div>
        </div>

        <!-- Main Call to Action -->
        <div class="w-full max-w-[320px] mt-10">
            <button class="w-full py-4 bg-primary text-white rounded-full shadow-lg shadow-primary/40 hover:shadow-xl hover:shadow-primary/50 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-3 font-semibold text-[16px]">
                <span class="material-symbols-outlined text-[20px]">download</span>
                Download Contact
            </button>
        </div>
    </main>
</body>
</html>
