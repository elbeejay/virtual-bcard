    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0f49bd",
                        "background-light": "#EBEAE5",
                        "background-dark": "#101622",
                        "surface": "#F4F3EF",
                        "text-main": "#2B2A27",
                        "text-muted": "#8A877E",

                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]

                    boxShadow: {
                        'emboss': '6px 6px 12px #D1D0CB, -6px -6px 12px #FFFFFF',
                        'emboss-sm': '4px 4px 8px #D1D0CB, -4px -4px 8px #FFFFFF',
                        'deboss': 'inset 4px 4px 8px #D1D0CB, inset -4px -4px 8px #FFFFFF',

                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        ::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
